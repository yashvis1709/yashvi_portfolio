<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <!-- Mobile / responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- SEO -->
  <title>Yashvi Shah | Aerospace Engineering Resume</title>

  <meta
    name="description"
    content="View the resume of Yashvi Shah, an Aerospace Engineering student in Toronto with experience in aerospace design, CAD, rocketry, electronics, manufacturing, and engineering teams."
  />

  <link
    rel="canonical"
    href="https://yashvishah.com/resume.html"
  />

  <!-- Open Graph / Social Sharing -->
  <meta
    property="og:type"
    content="profile"
  />

  <meta
    property="og:title"
    content="Yashvi Shah | Aerospace Engineering Resume"
  />

  <meta
    property="og:description"
    content="Resume of Yashvi Shah, an Aerospace Engineering student focused on aerospace design, CAD, rocketry, electronics, manufacturing, and engineering systems."
  />

  <meta
    property="og:url"
    content="https://yashvishah.com/resume.html"
  />

  <meta
    property="og:site_name"
    content="Yashvi Shah | Aerospace Engineering Portfolio"
  />

  <!-- Twitter / X -->
  <meta
    name="twitter:card"
    content="summary"
  />

  <meta
    name="twitter:title"
    content="Yashvi Shah | Aerospace Engineering Resume"
  />

  <meta
    name="twitter:description"
    content="View Yashvi Shah's aerospace engineering resume, including projects, technical experience, and engineering team involvement."
  />

  <!-- Styles -->
  <link
    rel="stylesheet"
    href="styles.css"
  />

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfilePage",
    "name": "Yashvi Shah | Aerospace Engineering Resume",
    "url": "https://yashvishah.com/resume.html",
    "description": "Resume of Yashvi Shah, an Aerospace Engineering student in Toronto.",
    "mainEntity": {
      "@type": "Person",
      "name": "Yashvi Shah",
      "url": "https://yashvishah.com/",
      "jobTitle": "Aerospace Engineering Student",
      "email": "mailto:yashvishah1709@gmail.com",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Toronto",
        "addressCountry": "CA"
      },
      "sameAs": [
        "https://www.linkedin.com/in/yashvi-shah17/",
        "https://github.com/yashvis1709"
      ]
    }
  }
  </script>

  <!-- Resume Viewer Styles -->
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      min-height: 100vh;
      overflow: hidden;
    }

    .resume-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 24px;
      background: rgba(5, 8, 22, 0.85);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
      flex-shrink: 0;
      z-index: 10;
    }

    .resume-bar a.back {
      color: var(--muted);
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
    }

    .resume-bar a.back:hover {
      color: var(--text);
    }

    .resume-embed {
      flex: 1;
      width: 100%;
      min-height: 0;
      border: none;
      background: var(--bg);
    }

    .resume-fallback {
      padding: 30px;
      text-align: center;
      color: var(--muted);
    }

    .resume-fallback a {
      color: var(--text);
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .resume-bar {
        padding: 12px 16px;
      }

      .resume-bar a.back {
        font-size: 13px;
      }

      .resume-bar .btn {
        font-size: 13px;
        padding: 10px 14px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       Resume Navigation
  ========================== -->
  <header class="resume-bar">

    <a
      class="back"
      href="index.html"
      aria-label="Return to Yashvi Shah portfolio"
    >
      ← Back to portfolio
    </a>

    <a
      class="btn btn-primary"
      href="resume.pdf"
      download="Yashvi_Shah_Resume.pdf"
    >
      Download PDF
    </a>

  </header>


  <!-- =========================
       Resume Viewer
  ========================== -->
  <main
    class="resume-embed"
    aria-label="Yashvi Shah resume"
  >

    <iframe
      class="resume-embed"
      src="resume.pdf"
      title="Yashvi Shah Aerospace Engineering Resume"
      loading="eager"
    >
      <div class="resume-fallback">
        <p>
          Your browser cannot display the resume directly.
        </p>

        <p>
          <a
            href="resume.pdf"
            download="Yashvi_Shah_Resume.pdf"
          >
            Download Yashvi Shah's Resume PDF
          </a>
        </p>
      </div>
    </iframe>

  </main>

</body>
</html>
