<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yashvi Shah — Resume</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .resume-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: rgba(5, 8, 22, 0.85);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
    }
    .resume-bar a.back {
      color: var(--muted);
      font-weight: 700;
      font-size: 14px;
    }
    .resume-bar a.back:hover { color: var(--text); }
    .resume-embed {
      flex: 1;
      width: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="resume-bar">
    <a class="back" href="index.html">← Back to portfolio</a>
    <a class="btn btn-primary" href="resume.pdf" download>Download PDF</a>
  </div>

  <embed src="resume.pdf" type="application/pdf" class="resume-embed" />
</body>
</html>
